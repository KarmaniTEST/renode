name: i.MX952 FuSa Qualification

on:
  workflow_dispatch:
  push:
    branches:
      - imx952-full-equivalence-program
    paths:
      - "scripts/pydev/nxp_imx952_system_manager_fusa.py"
      - "platforms/boards/nxp_imx952_evk_full.repl"
      - "tests/platforms/NXP_IMX952_FUSA_PRIORITY.robot"
      - "tests/platforms/NXP_IMX952_FUSA_FAULTS.robot"
      - "tools/imx952-digital-twin/equivalence/check_fusa_contract.py"
      - "tools/imx952-digital-twin/equivalence/contracts/imx952_fusa_priority_contract.json"
      - ".github/workflows/imx952-fusa.yml"
  pull_request:
    paths:
      - "scripts/pydev/nxp_imx952_system_manager_fusa.py"
      - "platforms/boards/nxp_imx952_evk_full.repl"
      - "tests/platforms/NXP_IMX952_FUSA_PRIORITY.robot"
      - "tests/platforms/NXP_IMX952_FUSA_FAULTS.robot"
      - "tools/imx952-digital-twin/equivalence/check_fusa_contract.py"
      - "tools/imx952-digital-twin/equivalence/contracts/imx952_fusa_priority_contract.json"
      - ".github/workflows/imx952-fusa.yml"

permissions:
  contents: read

jobs:
  qualify-fusa:
    name: Clean FuSa functional qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Validate FuSa source contract
        run: |
          python3 -m json.tool \
            tools/imx952-digital-twin/equivalence/contracts/imx952_fusa_priority_contract.json \
            >/dev/null
          python3 tools/imx952-digital-twin/equivalence/check_fusa_contract.py

      - name: Pull official Renode nightly runtime
        run: docker pull antmicro/renode:nightly-dotnet

      - name: Run FuSa state and fault regressions
        shell: bash
        run: |
          set +e
          docker run --rm \
            -v "$PWD:/workspace" \
            -v "$PWD/scripts/pydev/nxp_imx952_system_manager.py:/opt/renode/scripts/pydev/nxp_imx952_system_manager.py:ro" \
            -v "$PWD/scripts/pydev/nxp_imx952_system_manager_full.py:/opt/renode/scripts/pydev/nxp_imx952_system_manager_full.py:ro" \
            -v "$PWD/scripts/pydev/nxp_imx952_system_manager_transport.py:/opt/renode/scripts/pydev/nxp_imx952_system_manager_transport.py:ro" \
            -v "$PWD/scripts/pydev/nxp_imx952_system_manager_bbm.py:/opt/renode/scripts/pydev/nxp_imx952_system_manager_bbm.py:ro" \
            -v "$PWD/scripts/pydev/nxp_imx952_system_manager_misc.py:/opt/renode/scripts/pydev/nxp_imx952_system_manager_misc.py:ro" \
            -v "$PWD/scripts/pydev/nxp_imx952_system_manager_clock.py:/opt/renode/scripts/pydev/nxp_imx952_system_manager_clock.py:ro" \
            -v "$PWD/scripts/pydev/nxp_imx952_system_manager_pinctrl.py:/opt/renode/scripts/pydev/nxp_imx952_system_manager_pinctrl.py:ro" \
            -v "$PWD/scripts/pydev/nxp_imx952_system_manager_fusa.py:/opt/renode/scripts/pydev/nxp_imx952_system_manager_fusa.py:ro" \
            -v "$PWD/scripts/pydev/nxp_imx952_ele.py:/opt/renode/scripts/pydev/nxp_imx952_ele.py:ro" \
            -v "$PWD/scripts/pydev/nxp_imx952_lpi2c7.py:/opt/renode/scripts/pydev/nxp_imx952_lpi2c7.py:ro" \
            -w /workspace \
            antmicro/renode:nightly-dotnet \
            renode-test --show-log \
              tests/platforms/NXP_IMX952_FUSA_PRIORITY.robot \
              tests/platforms/NXP_IMX952_FUSA_FAULTS.robot \
            > imx952-fusa.log 2>&1
          status=$?
          echo "FuSa qualification exit status: ${status}"
          echo "----- FuSa qualification log -----"
          cat imx952-fusa.log || true
          echo "----- end FuSa qualification log -----"
          exit "${status}"

      - name: Upload FuSa evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imx952-fusa-log
          path: |
            imx952-fusa.log
            logs/**/*.log
          if-no-files-found: warn

      - name: Verify FuSa entry points
        if: success()
        run: |
          test -f scripts/pydev/nxp_imx952_system_manager_fusa.py
          test -f tests/platforms/NXP_IMX952_FUSA_PRIORITY.robot
          test -f tests/platforms/NXP_IMX952_FUSA_FAULTS.robot
          test -f tools/imx952-digital-twin/equivalence/check_fusa_contract.py
          test -f tools/imx952-digital-twin/equivalence/contracts/imx952_fusa_priority_contract.json
