name: i.MX952 Digital Twin Qualification

on:
  workflow_dispatch:
  push:
    branches:
      - imx952-a55-m7-support
      - imx952-digital-twin-ready
    paths:
      - "platforms/boards/nxp_imx952_evk.repl"
      - "scripts/pydev/nxp_imx952_*.py"
      - "scripts/single-node/nxp_imx952_*.resc"
      - "tests/platforms/NXP_IMX952*.robot"
      - "tests/platforms/NXP_IMX952/**"
      - "tools/imx952-digital-twin/**"
      - ".github/workflows/imx952-digital-twin.yml"
  pull_request:
    paths:
      - "platforms/boards/nxp_imx952_evk.repl"
      - "scripts/pydev/nxp_imx952_*.py"
      - "scripts/single-node/nxp_imx952_*.resc"
      - "tests/platforms/NXP_IMX952*.robot"
      - "tests/platforms/NXP_IMX952/**"
      - "tools/imx952-digital-twin/**"
      - ".github/workflows/imx952-digital-twin.yml"

permissions:
  contents: read

concurrency:
  group: imx952-digital-twin-${{ github.ref }}
  cancel-in-progress: true

env:
  RENODE_IMAGE: antmicro/renode:nightly-dotnet

jobs:
  qualify:
    name: Clean runtime qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Pull and identify official Renode runtime
        run: |
          docker pull "${RENODE_IMAGE}"
          docker image inspect "${RENODE_IMAGE}" --format 'Runtime image ID: {{.Id}}'

      - name: Validate deterministic Intel HEX fixtures
        shell: python
        run: |
          from pathlib import Path

          fixtures = sorted(Path("tests/platforms/NXP_IMX952").glob("*.hex"))
          if not fixtures:
              raise SystemExit("No i.MX952 HEX fixtures found")

          for path in fixtures:
              for line_number, line in enumerate(path.read_text().splitlines(), 1):
                  if not line.startswith(":"):
                      raise SystemExit(f"{path}:{line_number}: invalid Intel HEX record")
                  record = bytes.fromhex(line[1:])
                  if sum(record) & 0xFF:
                      raise SystemExit(f"{path}:{line_number}: checksum mismatch")
              print(f"Validated {path}")

      - name: Run i.MX952 regression suites
        shell: bash
        run: |
          set +e
          docker run --rm \
            -v "$PWD:/workspace" \
            -v "$PWD/scripts/pydev/nxp_imx952_system_manager.py:/opt/renode/scripts/pydev/nxp_imx952_system_manager.py:ro" \
            -v "$PWD/scripts/pydev/nxp_imx952_ele.py:/opt/renode/scripts/pydev/nxp_imx952_ele.py:ro" \
            -v "$PWD/scripts/pydev/nxp_imx952_lpi2c7.py:/opt/renode/scripts/pydev/nxp_imx952_lpi2c7.py:ro" \
            -w /workspace \
            "${RENODE_IMAGE}" \
            renode-test --show-log \
              tests/platforms/NXP_IMX952.robot \
              tests/platforms/NXP_IMX952_MU7_Firmware.robot \
            > imx952-qualification.log 2>&1
          status=$?
          echo "Qualification exit status: ${status}"
          echo "----- qualification log tail -----"
          tail -n 200 imx952-qualification.log || true
          echo "----- end qualification log tail -----"
          exit "${status}"

      - name: Verify operator entry points
        if: success()
        run: |
          test -f tools/imx952-digital-twin/README.md
          test -f tools/imx952-digital-twin/run.sh
          test -f tools/imx952-digital-twin/run.ps1
          test -f tools/imx952-digital-twin/qualify.sh
          test -f scripts/single-node/nxp_imx952_evk_heterogeneous_demo.resc
          test -f tests/platforms/NXP_IMX952_MU7_Firmware.robot

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imx952-qualification-log
          path: |
            imx952-qualification.log
            logs/**/*.log
          if-no-files-found: warn
