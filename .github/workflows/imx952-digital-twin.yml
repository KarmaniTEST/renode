name: i.MX952 Digital Twin Qualification

on:
  workflow_dispatch:
  push:
    branches:
      - imx952-a55-m7-support
      - imx952-digital-twin-ready
    paths:
      - "platforms/boards/nxp_imx952_evk.repl"
      - "scripts/pydev/nxp_imx952_*.py"
      - "scripts/single-node/nxp_imx952_*.resc"
      - "tests/platforms/NXP_IMX952.robot"
      - "tests/platforms/NXP_IMX952/**"
      - "tools/imx952-digital-twin/**"
      - ".github/workflows/imx952-digital-twin.yml"
  pull_request:
    paths:
      - "platforms/boards/nxp_imx952_evk.repl"
      - "scripts/pydev/nxp_imx952_*.py"
      - "scripts/single-node/nxp_imx952_*.resc"
      - "tests/platforms/NXP_IMX952.robot"
      - "tests/platforms/NXP_IMX952/**"
      - "tools/imx952-digital-twin/**"
      - ".github/workflows/imx952-digital-twin.yml"

permissions:
  contents: read

jobs:
  qualify:
    name: Clean runtime qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Pull official Renode nightly runtime
        run: docker pull antmicro/renode:nightly-dotnet

      - name: Run i.MX952 regression suite
        shell: bash
        run: |
          set +e
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            antmicro/renode:nightly-dotnet \
            renode-test tests/platforms/NXP_IMX952.robot \
            > imx952-qualification.log 2>&1
          status=$?
          echo "Qualification exit status: ${status}"
          echo "----- qualification log tail -----"
          tail -n 100 imx952-qualification.log || true
          echo "----- end qualification log tail -----"
          exit "${status}"

      - name: Upload qualification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imx952-qualification-log
          path: imx952-qualification.log
          if-no-files-found: warn

      - name: Verify operator entry points when present
        if: success()
        run: |
          if test -d tools/imx952-digital-twin; then
            test -f tools/imx952-digital-twin/README.md
            test -f tools/imx952-digital-twin/run.sh
            test -f tools/imx952-digital-twin/run.ps1
            test -f tools/imx952-digital-twin/qualify.sh
          fi
          test -f scripts/single-node/nxp_imx952_evk_heterogeneous_demo.resc
